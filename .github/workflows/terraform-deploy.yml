name: Sonatype Nexus CD

on: 
  workflow_dispatch: 
    inputs: 
      actions:
        type: choice
        options:
          - apply
          - destroy
        description: Please select apply or destroy

      environment: 
        type: choice
        options:
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2
        description: Please select region

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout Private Infrastructure Repository
        uses: actions/checkout@v4
        with:
          repository: 'issallina/sonatype-nexus-project' 
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: sonatype-nexus-project

      - name: Create tfvars file
        run: |
          cat << 'EOF' > sonatype-nexus-project/terraform/terraform.tfvars
          ${{ secrets.TFVARS }}
          EOF
          
          echo "=== Diagnostic Check ==="
          if [ -s sonatype-nexus-project/terraform/terraform.tfvars ]; then
            echo "Success: terraform.tfvars was created and is not empty!"
          else
            echo "Error: terraform.tfvars is empty! Check your GitHub Environment secrets."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.environment }}

      - name: Terraform Init
        run: |
          cd sonatype-nexus-project/terraform
          terraform init -input=false

      - name: Terraform Apply or Destroy
        run: |
          cd sonatype-nexus-project/terraform
          
          # Safely select or create the workspace matching your region dropdown choice
          terraform workspace select -or-create ${{ github.event.inputs.environment }}
          
          if [[ "${{ github.event.inputs.actions }}" == "apply" ]]
          then 
            terraform apply -input=false -auto-approve
          else 
            terraform destroy -input=false -auto-approve
          fi
