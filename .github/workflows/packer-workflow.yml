name: Packer AMI Build

on: 
  workflow_dispatch: 
    inputs: 
      action:
        type: choice
        options:
          - apply
          - destroy
        description: Please select apply or destroy

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Private Infrastructure Repository
        uses: actions/checkout@v4
        with:
          repository: 'issallina/sonatype-nexus-project'
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: sonatype-nexus-project 

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 

      - name: Setup Packer (Apply)
        if: ${{ inputs.action == 'apply' }}
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      - name: Run Packer Build
        if: ${{ inputs.action == 'apply' }}
        working-directory: ./sonatype-nexus-project/packer
        run: |
          packer init .
          packer build .
        env:
          PKR_VAR_source_ami: ${{ secrets.PACKER_SOURCE_AMI }}
          PKR_VAR_security_group_id: ${{ secrets.PACKER_SG_ID }}
          PKR_VAR_ssh_keypair_name: ${{ secrets.PACKER_KEY_NAME }}
      

      - name: Global AMI Purge
        if: ${{ inputs.action == 'destroy' }}
        run: |
          chmod +x ./sonatype-nexus-project/packer/packer-destroy.sh
          ./sonatype-nexus-project/packer/packer-destroy.sh